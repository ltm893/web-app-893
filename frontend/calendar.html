<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DLIV — Calendar</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="slideshow.css" />
  <style>
    body { display: flex; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; }

    #sidenav {
      width: 220px; min-width: 220px; background: #1e3a5f;
      display: flex; flex-direction: column; padding: 1.5rem 0;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
      box-shadow: 2px 0 12px rgba(0,0,0,0.12); transition: transform 0.25s;
    }
    .nav-title { color: white; font-size: 1.4rem; font-weight: 700; letter-spacing: 0.08em; padding: 0 1.25rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nav-title span { color: rgba(255,255,255,0.4); font-size: 0.7rem; font-weight: 400; display: block; margin-top: 0.1rem; }
    .nav-section { margin-top: 0.75rem; }
    .nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 1.25rem; color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
    .nav-item[hidden] { display: none !important; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
    .nav-item.active { background: rgba(255,255,255,0.12); color: white; border-left-color: white; font-weight: 600; }
    .nav-item .icon { font-size: 1rem; width: 1.2rem; text-align: center; }
    .nav-out { padding: 0.35rem 0 0.15rem; border-top: 1px solid rgba(255,255,255,0.1); }
    #nav-out[hidden] { display: none !important; }
    .nav-sub-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.32rem 1.25rem; color: rgba(255,255,255,0.42); text-decoration: none; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
    .nav-sub-item:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); }
    .nav-sub-item::before { content: "↗"; font-size: 0.7rem; opacity: 0.55; }
    .nav-spacer { flex: 1; }
    .nav-bottom { padding: 0.35rem 1.25rem 1rem; font-size: 0.75rem; color: rgba(255,255,255,0.3); }
    #hamburger { display: none; position: fixed; top: 0.75rem; left: 0.75rem; z-index: 200; background: #1e3a5f; color: white; border: none; border-radius: 8px; padding: 0.4rem 0.7rem; font-size: 1.2rem; cursor: pointer; }
    #nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
    #main-content { margin-left: 220px; flex: 1; padding: 1.5rem; }

    #cal-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    #cal-month-title { font-size: 1.2rem; font-weight: 700; color: #1e3a5f; flex: 1; }
    #cal-header button { font-size: 0.82rem; padding: 0.35rem 0.9rem; border-radius: 20px; cursor: pointer; font-family: Arial, sans-serif; font-weight: 500; border: 1.5px solid #1e3a5f; background: transparent; color: #1e3a5f; transition: all 0.15s; }
    #cal-header button:hover { background: #1e3a5f; color: white; }
    #cal-signout { border-color: #ddd !important; color: #888 !important; }
    #cal-signout:hover { border-color: #e11d48 !important; color: #e11d48 !important; background: transparent !important; }

    #cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #e2e8f0; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .cal-dow { background: #1e3a5f; color: white; text-align: center; font-size: 0.75rem; font-weight: 700; padding: 0.4rem 0; letter-spacing: 0.05em; }
    .cal-cell { background: white; min-height: 90px; padding: 0.25rem 0.35rem; cursor: pointer; transition: background 0.12s; }
    .cal-cell:hover { background: #f0f5ff; }
    .cal-cell--empty { background: #f8fafc; cursor: default; pointer-events: none; }
    .cal-cell--today { background: #eef4ff; }
    .cal-cell--today:hover { background: #ddeaff; }
    .cal-cell--today .cal-day-num { color: #1e3a5f; font-weight: 800; }
    .cal-day-num { font-size: 0.8rem; color: #64748b; font-weight: 600; line-height: 1.4; display: flex; align-items: center; justify-content: space-between; }
    .cal-day-add-hint { font-size: 0.65rem; color: #cbd5e1; font-weight: 400; opacity: 0; transition: opacity 0.15s; }
    .cal-cell:hover .cal-day-add-hint { opacity: 1; color: #1e3a5f; }
    .cal-events { margin-top: 0.25rem; }
    .cal-event { font-size: 0.7rem; background: #1e3a5f; color: white; border-radius: 3px; padding: 0.1rem 0.3rem; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.15s; }
    .cal-event:hover { background: #16304f; }
    .cal-event-time { opacity: 0.75; }
    .cal-loading, .cal-error { grid-column: 1/-1; padding: 2rem 1rem; text-align: center; color: #94a3b8; font-size: 0.9rem; background: #fff; }
    .cal-error { color: #e11d48; }

    #cal-modal { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; }
    #cal-modal-box { background: white; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); margin: 1rem; }
    #cal-modal-box h3 { margin: 0 0 1rem; color: #1e3a5f; font-size: 1rem; }
    #cal-modal-box input, #cal-modal-box textarea { display: block; width: 100%; box-sizing: border-box; margin: 0.35rem 0; padding: 0.45rem 0.75rem; border: 1.5px solid #dde3ec; border-radius: 8px; font-size: 0.88rem; font-family: Arial, sans-serif; outline: none; transition: border-color 0.15s; }
    #cal-modal-box input:focus, #cal-modal-box textarea:focus { border-color: #1e3a5f; }
    #cal-modal-box label { font-size: 0.75rem; color: #64748b; display: block; margin-top: 0.6rem; }
    #cal-modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    #cal-modal-actions button { font-size: 0.82rem; padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-family: Arial, sans-serif; font-weight: 500; border: 1.5px solid #1e3a5f; transition: all 0.15s; }
    #cal-modal-save { background: #1e3a5f; color: white; }
    #cal-modal-save:hover { background: #16304f; }
    #cal-modal-cancel { background: transparent; color: #1e3a5f; }
    #cal-modal-cancel:hover { background: #1e3a5f; color: white; }
    #cal-modal-delete { background: transparent; color: #e11d48; border-color: #e11d48; margin-left: auto; }
    #cal-modal-delete:hover { background: #e11d48; color: white; }
    #cal-modal-createdby { font-size: 0.75rem; color: #94a3b8; margin-top: 0.75rem; }

    @media (max-width: 600px) {
      #sidenav { transform: translateX(-100%); padding-top: 3.75rem; }
      #sidenav.open { transform: translateX(0); }
      #hamburger { display: block; }
      #nav-overlay.visible { display: block; }
      #main-content { margin-left: 0; padding: 1rem; padding-top: 3.5rem; }
      .cal-cell { min-height: 60px; }
      .cal-event { font-size: 0.62rem; }
    }
  </style>
</head>
<body>

  <button id="hamburger" onclick="toggleNav()">☰</button>
  <div id="nav-overlay" onclick="toggleNav()"></div>

  <nav id="sidenav">
    <div class="nav-title">DLIV <span>Family &amp; Friends</span></div>
    <div class="nav-section">
      <a class="nav-item" href="/index.html#slideshows"><span class="icon">🎞</span> Slideshows</a>
      <a class="nav-item" href="/index.html#friends"><span class="icon">🔒</span> Dropbox</a>
      <a class="nav-item" data-nav="ancestry" hidden href="/index.html#ancestry"><span class="icon">📜</span> <span data-pdf-search-label>PDF Search</span></a>
      <div class="nav-item active"><span class="icon">📅</span> Calendar</div>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-out" id="nav-out" hidden></div>
    <div class="nav-bottom">&copy; 2020 DLIV</div>
  </nav>

  <main id="main-content">
    <div class="auth-sign-shell">
    <div id="cal-login" class="auth-sign-card auth-sign-block" style="display:none">
      <h3>Sign In</h3>
      <input type="email" id="cal-email" placeholder="Email" autocomplete="username" />
      <div class="auth-password-row">
        <input type="password" id="cal-password" placeholder="Password" autocomplete="current-password" />
        <span class="auth-show-pwd" onclick="togglePwd('cal-password',this)">Show</span>
      </div>
      <button type="button" class="auth-signin-submit" onclick="handleCalSignIn()">Sign In</button>
      <p id="cal-login-error" class="auth-sign-error"></p>
    </div>
    </div>

    <div id="cal-content" style="display:none">
      <div id="cal-header">
        <button onclick="calendarPrevMonth()">&#8592; Prev</button>
        <div id="cal-month-title"></div>
        <button onclick="calendarNextMonth()">Next &#8594;</button>
        <button id="cal-signout" onclick="handleCalSignOut()">Sign Out</button>
      </div>
      <div id="cal-grid"></div>
    </div>
  </main>

  <div id="cal-modal">
    <div id="cal-modal-box">
      <h3 id="cal-modal-title">Add event</h3>
      <input type="hidden" id="cal-form-id" />
      <label>Title</label>
      <input type="text" id="cal-form-title" placeholder="Event title" />
      <label>Description</label>
      <textarea id="cal-form-desc" rows="2" placeholder="Optional description"></textarea>
      <label>Start</label>
      <input type="datetime-local" id="cal-form-start" />
      <label>End</label>
      <input type="datetime-local" id="cal-form-end" />
      <div id="cal-modal-createdby"></div>
      <div id="cal-modal-actions">
        <button id="cal-modal-save"   onclick="saveCalEvent()">Save</button>
        <button id="cal-modal-cancel" onclick="closeCalModal()">Cancel</button>
        <button id="cal-modal-delete" onclick="deleteCalEvent()" style="display:none">Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { applySiteChrome } from "./siteNav.js";
    fetch("/dliv_outputs.json").then((r) => r.json()).then(applySiteChrome).catch(() => {});
  </script>
  <script type="module" src="./calendar.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      import("./calendar.js").then(() => window.initCalendar());
    });

    document.getElementById("cal-modal").addEventListener("click", (e) => {
      if (e.target === document.getElementById("cal-modal")) closeCalModal();
    });

    function toggleNav() {
      document.getElementById("sidenav").classList.toggle("open");
      document.getElementById("nav-overlay").classList.toggle("visible");
    }

    function togglePwd(id, el) {
      const input = document.getElementById(id);
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      el.textContent = show ? "Hide" : "Show";
    }
  </script>
</body>
</html>
